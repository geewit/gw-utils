plugins {
    id 'java'
    id 'java-gradle-plugin'
}

apply from: file("common-resolution-strategy.gradle")

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

sourceSets {
    main {
        java.setSrcDirs(['src/main/java'])
        resources.setSrcDirs([])
    }
    test {
        java.setSrcDirs(['src/test/java'])
        resources.setSrcDirs([])
    }
}

def rootProps = new Properties()
file("${projectDir}/../gradle.properties").withInputStream { rootProps.load(it) }

def versionMap = rootProps.collectEntries { key, value ->
    String propKey = key.toString()
    String alias = propKey.endsWith('.version') ? propKey[0..-9] : propKey
    [(alias): value.toString()]
} as Map<String, String>
ExtensionContainer extensionContainer = rootProject.extensions
VersionCatalogsExtension catalogs = extensionContainer.findByType(VersionCatalogsExtension)
VersionCatalog libs = catalogs?.find("libs")?.orElse(null)
def rootExtraProperties = extensionContainer.getByType(ExtraPropertiesExtension)

configurations {
    configureEach { config ->
        rootExtraProperties.applyCommonResolutionStrategy(config, libs, versionMap)
    }
}

dependencies {
    implementation gradleApi()

    implementation "com.gradleup.shadow:com.gradleup.shadow.gradle.plugin:${rootProps['shadow.plugin.version']}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${rootProps['jackson2.core.version']}"
}
