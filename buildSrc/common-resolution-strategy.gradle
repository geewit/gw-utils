                    useCatalogVersion('nimbus-jose-jwt', 'nimbus.jose.jwt')
                } else if (requestedName == 'oauth2-oidc-sdk') {
                    useCatalogVersion('nimbus-oauth2-oidc-sdk', 'nimbus.oauth2.oidc.sdk')
