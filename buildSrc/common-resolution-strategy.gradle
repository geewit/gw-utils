            } else if (requestedGroup == 'org.junit.jupiter') {
                useCatalogVersion('junit-jupiter')
            } else if (requestedGroup == 'org.junit.platform') {
                useCatalogVersion('junit-platform')
            } else if (requestedGroup == 'com.google.errorprone') {
                useCatalogVersion('google.errorprone')
            } else if (requestedGroup == 'com.google.guava' && requestedName == 'guava') {
                useCatalogVersion('google.guava')
            } else if (requestedGroup == 'com.google.code.gson') {
                useCatalogVersion('google.gson')
            } else if (requestedGroup == 'com.google.code.findbugs') {
                useCatalogVersion('google.findbugs')
            } else if (requestedGroup.startsWith('com.fasterxml.jackson')) {
                // 你原始逻辑：annotations 用 jackson2.annotations，其它 jackson2.core
                if (requestedGroup == 'com.fasterxml.jackson.core' && requestedName == 'jackson-annotations') {
                    useCatalogVersion('jackson2.annotations')
                } else {
                    useCatalogVersion('jackson2.core')
                }
            } else if (requestedGroup.startsWith('tools.jackson')) {
                useCatalogVersion('jackson.core')
            } else if (requestedGroup.startsWith('com.microsoft.onnxruntime')) {
                useCatalogVersion('onnxruntime')
            } else if (requestedGroup.startsWith('com.github.spotbugs')) {
                useCatalogVersion('spotbugs')
            } else if (requestedGroup.startsWith('com.google.j2objc')) {
                useCatalogVersion('j2objc')
            } else if (requestedGroup == 'com.github.luben' && requestedName == 'zstd-jni') {
                useCatalogVersion('zstd-jni')
            } else if (requestedGroup == 'it.unimi.dsi' && requestedName == 'fastutil') {
                useCatalogVersion('fastutil')
            } else if (requestedGroup.startsWith('org.objenesis')) {
                useCatalogVersion('objenesis')
            } else if (requestedGroup.startsWith('org.jetbrains')) {
                // 你原始逻辑：把 annotations-java5 / annotations 都重定向为 org.jetbrains:annotations
                if (requestedName == 'annotations-java5' || requestedName == 'annotations') {
                    useCatalogTarget('jetbrains-annotations', [group: 'org.jetbrains', name: 'annotations'])
                } else if (requestedGroup == 'org.jetbrains.kotlin') {
                    useCatalogVersion('jetbrains-kotlin')
                }
            } else if (requestedGroup.startsWith('org.jsoup')) {
                useCatalogVersion('jsoup')
            } else if (requestedGroup == 'com.twitter.twittertext') {
                useCatalogVersion('twitter-text')
            } else if (requestedGroup == 'de.rototor.pdfbox') {
                useCatalogVersion('rototor-pdfbox')
            } else if (requestedGroup == 'org.tukaani' && requestedName == 'xz') {
                useCatalogVersion('tukaani-xz')
            } else if (requestedGroup == 'org.xerial.snappy' && requestedName == 'snappy-java') {
                useCatalogVersion('snappy-java')
            } else if (requestedGroup == 'org.xmlunit') {
                useCatalogVersion('xmlunit')
            } else if (requestedGroup == 'org.tomlj') {
                useCatalogVersion('tomlj')
            } else if (requestedGroup == 'org.codehaus.plexus') {
                if (requestedName == 'plexus-utils') {
