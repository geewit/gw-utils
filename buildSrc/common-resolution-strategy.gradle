            } else if (requestedGroup == 'io.projectreactor.netty') {
                useCatalogVersion('reactor-netty')
            } else if (requestedGroup == 'io.swagger.core.v3') {
                useCatalogVersion('swagger-core')
            } else if (requestedGroup == 'org.webjars' && requestedName == 'swagger-ui') {
                useCatalogVersion('swagger-ui')
            } else if (requestedGroup == 'org.apache.tomcat.embed') {
                useCatalogVersion('tomcat')
            } else if (requestedGroup == 'com.jayway.jsonpath' && requestedName == 'json-path') {
