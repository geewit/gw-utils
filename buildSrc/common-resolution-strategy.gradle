            } else if (requestedGroup == 'org.codehaus.woodstox' && requestedName == 'stax2-api') {
                useCatalogVersion('stax2-api')
            } else if (requestedGroup == 'org.hamcrest') {
                useCatalogVersion('hamcrest')
            }
        }
