ext.determineJavaLanguageVersion = { Project project ->
    int requestedVersion = (rootProject.findProperty('io.geewit.java.version') ?: "${Runtime.version().feature()}").toString().toInteger()
    // 这里要求项目已经应用了 java / java-library 之类的插件
    if (requestedVersion <= 21) {
        throw new IllegalArgumentException("Requested Java version must be positive, but was: ${requestedVersion}")
    }

    JavaToolchainService toolchainService = project.extensions.getByType(JavaToolchainService)
    JavaLanguageVersion requested = JavaLanguageVersion.of(requestedVersion)
    int runtimeVersion = Runtime.version().feature()
    JavaLanguageVersion fallback = JavaLanguageVersion.of(runtimeVersion)

    if (requested.asInt() == fallback.asInt()) {
        return requested
    }

    try {
        toolchainService.launcherFor {
            languageVersion.set(requested)
            implementation.set(JvmImplementation.VENDOR_SPECIFIC)
        }.get()
        return requested
    } catch (Exception ignored) {
        project.logger.info(
                "Java {} toolchain not found; falling back to runtime Java {} for project '{}'.",
                requested.asInt(),
                fallback.asInt(),
                project.name
        )
        return fallback
    }
}

ext.applyCommonResolutionStrategy = { config, libs, versions ->
    config.resolutionStrategy {
        eachDependency { details ->
            def requestedGroup = details.requested.group as String
            def requestedName = details.requested.name as String

            def resolveVersion = { String alias ->
                def v = libs?.findVersion(alias)
                if (v?.present) {
                    return v.get().requiredVersion
                }
                if (versions?.containsKey(alias)) {
                    return versions.get(alias) as String
                }
                return null
            }

            // 小工具：按 alias(可多个候选) 从 libs 里取版本并应用
            def useCatalogVersion = { String... aliases ->
                for (String alias : aliases) {
                    def version = resolveVersion(alias)
                    if (version) {
                        println "useCatalogVersion alias: ${alias}, ${requestedGroup}:${requestedName} -> ${version}"
                        details.useVersion(version)
                        return true
                    }
                }
                return false
            }

            // 小工具：用于 useTarget（例如把 org.jetbrains:* 统一改为 org.jetbrains:annotations）
            def useCatalogTarget = { String versionAlias, Map<String, String> target ->
                def version = resolveVersion(versionAlias)
                if (version) {
                    details.useTarget([
                            group  : target.group,
                            name   : target.name,
                            version: version
                    ])
                    return true
                }
                return false
            }

            // ---------------------------
            // 规则开始（按你原始逻辑重排）
            // ---------------------------
            if (requestedGroup == 'biz.aQute.bnd') {
                useCatalogVersion('aQute.bnd')
            } else if (requestedGroup == 'commons-codec' && requestedName == 'commons-codec') {
                useCatalogVersion('commons-codec')
            } else if (requestedGroup == 'commons-io' && requestedName == 'commons-io') {
                useCatalogVersion('commons-io')
            } else if (requestedGroup == 'commons-logging' && requestedName == 'commons-logging') {
                useCatalogVersion('commons-logging')
            } else if (requestedGroup == 'org.apache.commons') {
                if (requestedName == 'commons-collections4') {
                    useCatalogVersion('commons-collections4')
                } else if (requestedName == 'commons-compress') {
                    useCatalogVersion('commons-compress')
                } else if (requestedName == 'commons-csv') {
                    useCatalogVersion('commons-csv')
                } else if (requestedName == 'commons-lang3') {
                    useCatalogVersion('commons-lang3')
                } else if (requestedName == 'commons-math3') {
                    useCatalogVersion('commons-math3')
                } else if (requestedName == 'commons-text') {
                    useCatalogVersion('commons-text')
                }
            } else if (requestedGroup == 'args4j' && requestedName == 'args4j') {
                useCatalogVersion('args4j')
            } else if (requestedGroup == 'co.nstant.in' && requestedName == 'cbor') {
                useCatalogVersion('cbor')
            } else if (requestedGroup == 'ai.djl' || requestedGroup.startsWith('ai.djl.')) {
                useCatalogVersion('djl')
            } else if (requestedGroup == 'org.awaitility' && requestedName == 'awaitility') {
                useCatalogVersion('awaitility')
            } else if ('org.javassist' == requestedGroup) {
                useCatalogVersion('javassist')
            } else if (requestedGroup == 'org.slf4j' && requestedName == 'slf4j-api') {
                useCatalogVersion('slf4j')
            } else if (requestedGroup == 'org.projectlombok') {
                useCatalogVersion('lombok')
            } else if (requestedGroup == 'com.fasterxml' && requestedName == 'classmate') {
                useCatalogVersion('classmate')
            } else if (requestedGroup.startsWith('com.fasterxml.jackson')) {
                if (requestedGroup == 'com.fasterxml.jackson.core') {
                    if (requestedName == 'jackson-annotations') {
                        useCatalogVersion('jackson2.annotations')
                    } else {
                        useCatalogVersion('jackson2.core')
                    }
                } else {
                    useCatalogVersion('jackson2.core')
                }
            } else if (requestedGroup.startsWith('tools.jackson')) {
                useCatalogVersion('jackson.core')
            } else if (requestedGroup == 'com.fasterxml.classmate') {
                useCatalogVersion('classmate')
            } else if (requestedGroup == 'com.fasterxml.woodstox') {
                useCatalogVersion('woodstox')
            } else if (requestedGroup.startsWith('org.springframework')) {
                if (requestedGroup == 'org.springframework') {
                    useCatalogVersion('spring')
                } else if (requestedGroup == 'org.springframework.boot') {
                    useCatalogVersion('spring-boot')
                } else if (requestedGroup == 'org.springframework.data') {
                    useCatalogVersion('spring.data')
                } else if (requestedGroup == 'org.springframework.retry') {
                    useCatalogVersion('spring-retry')
                } else if (requestedGroup == 'org.springframework.security') {
                    useCatalogVersion('spring-security')
                } else {
                    useCatalogVersion('spring')
                }
            } else if (requestedGroup == 'org.hibernate.validator') {
                useCatalogVersion('hibernate.validator')
            } else if (requestedGroup == 'org.jbibtex') {
                useCatalogVersion('jbibtex')
            } else if (requestedGroup == 'org.jboss.logging') {
                useCatalogVersion('jboss-logging')
            } else if (requestedGroup == 'org.osgi' && requestedName == 'org.osgi.resource') {
                useCatalogVersion('osgi-resource')
            } else if (requestedGroup == 'org.junit.jupiter') {
                useCatalogVersion('junit-jupiter')
            } else if (requestedGroup == 'org.junit.platform') {
                useCatalogVersion('junit-platform')
            } else if (requestedGroup == 'org.apache.logging.log4j') {
                useCatalogVersion('log4j')
            } else if (requestedGroup == 'org.jline') {
                useCatalogVersion('jline')
            } else if (requestedGroup == 'jakarta.activation') {
                useCatalogVersion('jakarta-activation-api', 'jakarta.activation.api')
            } else if (requestedGroup == 'jakarta.annotation') {
                useCatalogVersion('jakarta-annotation-api', 'jakarta.annotation.api')
            } else if (requestedGroup == 'jakarta.validation') {
                useCatalogVersion('jakarta-validation-api', 'jakarta.validation.api')
            } else if (requestedGroup == 'jakarta.xml.bind') {
                useCatalogVersion('jakarta-xml-bind', 'jakarta.xml.bind')
            } else if (requestedGroup == 'org.antlr' && requestedName == 'antlr4-runtime') {
                useCatalogVersion('antlr4', 'antlr4')
            } else if (requestedGroup == 'org.assertj') {
                useCatalogVersion('assertj')
            } else if (requestedGroup == 'org.ow2.asm') {
                useCatalogVersion('asm')
            } else if (requestedGroup == 'org.apache.logging.log4j') {
                useCatalogVersion('log4j')
            } else if (requestedGroup == 'org.apache.lucene') {
                useCatalogVersion('lucene')
            } else if (requestedGroup == 'org.apache.pdfbox') {
                useCatalogVersion('pdfbox')
            } else if (requestedGroup == 'blue.strategic.parquet') {
                useCatalogVersion('parquet-floor', 'parquet.floor')
            } else if (requestedGroup == 'ch.qos.logback') {
                useCatalogVersion('logback')
            } else if (requestedGroup == 'org.slf4j') {
                useCatalogVersion('slf4j')
            } else if (requestedGroup == 'com.h2database') {
                useCatalogVersion('h2')
            } else if (requestedGroup == 'com.squareup.okhttp3') {
                useCatalogVersion('squareup-okhttp')
            } else if (requestedGroup == 'com.squareup.okio') {
