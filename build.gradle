import org.gradle.api.artifacts.VersionCatalog
import org.gradle.api.artifacts.VersionCatalogsExtension
import org.gradle.api.plugins.JavaPluginExtension
import org.gradle.api.publish.PublishingExtension
import org.gradle.api.publish.maven.MavenPublication
import org.gradle.api.tasks.bundling.Jar
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.api.tasks.javadoc.Javadoc
import org.gradle.api.tasks.testing.Test
import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent
import org.gradle.internal.os.OperatingSystem
import org.gradle.jvm.toolchain.JavaLanguageVersion
import org.gradle.jvm.toolchain.JvmImplementation
import org.gradle.plugins.signing.Sign
import org.gradle.plugins.signing.SigningExtension
import org.gradle.testing.jacoco.tasks.JacocoCoverageVerification
import org.gradle.testing.jacoco.tasks.JacocoReport
import org.jreleaser.gradle.plugin.JReleaserExtension
import org.jreleaser.model.Active
import java.nio.charset.StandardCharsets


plugins {
    id 'maven-publish'
    id 'signing'
    id 'org.springframework.boot' apply(false)
    id 'com.gradleup.shadow' apply(false)
    id 'org.graalvm.buildtools.native' apply(false)
    id 'org.jreleaser' apply(false)
}

apply from: file('buildSrc/common-resolution-strategy.gradle')

// -------------------------------
// 发布开关与凭据：保持 gw-utils 既有 JReleaser 发布方式
// -------------------------------
def publishEnabled = providers.gradleProperty('io.geewit.publish.enabled')
        .map { it.toBoolean() }
        .getOrElse(false)
def sonatypeUsername = providers.gradleProperty('SONATYPE_USERNAME').getOrNull()
def sonatypePassword = providers.gradleProperty('SONATYPE_PASSWORD').getOrNull()

ext.publishEnabled = publishEnabled
ext.sonatypeUsername = sonatypeUsername
ext.sonatypePassword = sonatypePassword

allprojects {
    version = rootProject.providers.gradleProperty('version').getOrNull()
}

subprojects { subproject ->
    File localGradleFile = subproject.file('build.gradle')
    boolean hasLocalBuild = localGradleFile.exists()
    logger.info("project '${subproject.name}' has local build.gradle: ${hasLocalBuild}")
    if (!hasLocalBuild) {
        return
    }

    Properties localProps = new Properties()
    File localPropsFile = subproject.file('gradle.properties')
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { localProps.load(it) }
    }

    String localGroup = localProps.getProperty('group')
    String localArtifactId = localProps.getProperty('artifactId')

    subproject.group = localGroup ?: 'io.geewit.utils'

    // ------------------------------------------------
    // 1. 基础 Java Library 能力
    // ------------------------------------------------
    subproject.pluginManager.apply('java-library')
    subproject.pluginManager.apply('jacoco')

    if (publishEnabled) {
        subproject.pluginManager.apply('maven-publish')
        subproject.pluginManager.apply('signing')
        subproject.pluginManager.apply('org.jreleaser')
    }

    VersionCatalogsExtension catalogs = rootProject.extensions.findByType(VersionCatalogsExtension)
    VersionCatalog libs = catalogs?.named('libs')

    // ------------------------------------------------
    // 2. Java toolchain：复用 friso 的统一解析逻辑
    // ------------------------------------------------
    JavaLanguageVersion javaLanguageVersion = rootProject.ext.determineJavaLanguageVersion(subproject) as JavaLanguageVersion

    // ------------------------------------------------
    // 3. 统一依赖排除 + 版本对齐
    // ------------------------------------------------
    configurations {
        configureEach { config ->
            config.exclude([group: 'com.google.protobuf'])
            config.exclude([group: 'org.springframework.boot', module: 'spring-boot-dependencies'])
            config.exclude([group: 'org.springframework.boot', module: 'spring-boot-starter-web'])
            config.exclude([group: 'org.springframework', module: 'spring-webmvc'])
            config.exclude([group: 'org.slf4j', module: 'slf4j-log4j12'])
            config.exclude([group: 'org.slf4j', module: 'slf4j-simple'])
            config.exclude([group: 'org.yaml'])
            config.exclude([group: 'org.mockito', module: 'mockito-all'])
            config.exclude([group: 'org.apache.ant'])
            config.exclude([group: 'io.netty', module: 'netty-tcnative-classes'])
            config.exclude([group: 'ua.net.nlp', module: 'morfologik-ukrainian-search'])
            config.exclude([group: 'com.zaxxer', module: 'HikariCP'])

            if (subproject.path.startsWith(':javafx:')) {
                config.exclude([group: 'ch.qos.logback'])
                config.exclude([group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'])
            }

            if (OperatingSystem.current().isWindows()) {
                config.exclude([group: 'io.netty', module: 'netty-transport-classes-epoll'])
            }
            if (!OperatingSystem.current().isMacOsX()) {
                config.exclude([group: 'io.netty', module: 'netty-resolver-dns-classes-macos'])
                config.exclude([group: 'io.netty', module: 'netty-resolver-dns-native-macos'])
            }

            rootProject.ext.applyCommonResolutionStrategy(config, libs, [:])
        }
    }

    extensions.configure(JavaPluginExtension) { javaExt ->
        javaExt.toolchain { toolchain ->
            toolchain.languageVersion.set(javaLanguageVersion)
            toolchain.implementation.set(JvmImplementation.VENDOR_SPECIFIC)
        }
        javaExt.withSourcesJar()
        javaExt.withJavadocJar()
    }

    // ------------------------------------------------
    // 4. 编译、Javadoc、测试、覆盖率
    // ------------------------------------------------
    tasks.withType(JavaCompile).configureEach { JavaCompile javaCompile ->
        javaCompile.options.encoding = StandardCharsets.UTF_8.name()
    }

    tasks.withType(Javadoc).configureEach { Javadoc javadoc ->
        javadoc.options.encoding = StandardCharsets.UTF_8.name()
        javadoc.options.charSet = StandardCharsets.UTF_8.name()
        javadoc.options.docEncoding = StandardCharsets.UTF_8.name()
        javadoc.options.addBooleanOption('Xdoclint:none', true)
        javadoc.options.addBooleanOption('quiet', true)
    }

    tasks.withType(Test).configureEach { Test test ->
        test.useJUnitPlatform()
        test.testLogging {
            events TestLogEvent.FAILED, TestLogEvent.SKIPPED, TestLogEvent.PASSED
            exceptionFormat = TestExceptionFormat.FULL
        }
        test.finalizedBy 'jacocoTestReport'
        test.jvmArgs '-Dtestfx.robot=glass', '-Dglass.platform=Monocle', '-Dmonocle.platform=Headless', '-Dprism.order=sw', '-Dprism.text=t2k'
    }

    tasks.withType(JacocoReport).configureEach { JacocoReport report ->
        report.reports {
            xml.required = true
            html.required = true
        }
    }

    tasks.register('jacocoCoverageVerification', JacocoCoverageVerification) { JacocoCoverageVerification verification ->
        verification.executionData subproject.tasks.named('test').get()
        verification.classDirectories.from(subproject.sourceSets.main.output)
        verification.violationRules {
            rule {
                limit {
                    minimum = switch (subproject.path) {
                        case ':core:codec' -> 0.92
                        case ':javafx:base' -> 0.37
                        case ':javafx:controls' -> 0.67
                        case ':javafx:spring' -> 0.94
                        default -> 0.95
                    }
                }
            }
        }
    }

    tasks.named('check').configure {
        dependsOn 'jacocoCoverageVerification'
    }

    tasks.withType(Jar).configureEach { Jar jar ->
        if (jar.archiveClassifier.getOrElse('') == '') {
            jar.manifest {
                attributes(
                        'Implementation-Title': "${localGroup ?: subproject.group}:${localArtifactId ?: subproject.name}",
                        'Implementation-Version': subproject.version as String
                )
            }
        }
    }

    // ------------------------------------------------
    // 5. Maven Publish + Signing + JReleaser
    // ------------------------------------------------
    if (publishEnabled) {
        afterEvaluate {
            extensions.configure(PublishingExtension) { PublishingExtension publishing ->
                publishing.publications { publications ->
                    publications.register('mavenJava', MavenPublication) { MavenPublication publication ->
                        groupId = (localGroup ?: subproject.group.toString())
                        artifactId = (localArtifactId ?: subproject.name)
                        version = rootProject.version.toString()

                        from subproject.components.java

                        pom {
                            name = findProperty('POM_NAME') ?: 'gw-utils'
                            if ((findProperty('POM_DESCRIPTION') ?: '').toString()) {
                                description = findProperty('POM_DESCRIPTION').toString()
                            }
                            url = findProperty('POM_URL') ?: 'https://github.com/geewit/gw-utils'
                            licenses {
                                license {
                                    name = findProperty('POM_LICENCE_NAME') ?: 'The MIT License (MIT)'
                                    url = findProperty('POM_LICENCE_URL') ?: 'https://mit-license.org/'
                                    distribution = findProperty('POM_LICENCE_DIST') ?: 'repo'
                                }
                            }
                            developers {
                                developer {
                                    id = findProperty('POM_DEVELOPER_ID') ?: 'geewit'
                                    name = findProperty('POM_DEVELOPER_NAME') ?: 'Huang Fang'
                                    email = findProperty('POM_DEVELOPER_EMAIL') ?: 'hf@geewit.io'
                                    url = 'https://github.com/geewit/gw-utils/graphs/contributors'
                                }
                            }
                            scm {
                                connection = findProperty('POM_SCM_CONNECTION') ?: 'scm:git:https://github.com/geewit/gw-utils.git'
                                developerConnection = findProperty('POM_SCM_DEV_CONNECTION') ?: 'https://github.com/geewit/gw-utils.git'
                                url = findProperty('POM_SCM_URL') ?: 'scm:git:https://github.com/geewit/gw-utils'
                            }
                        }
                    }
                }

                publishing.repositories {
                    maven {
                        name = 'jreleaser'
                        url = subproject.layout.buildDirectory.dir('staging-deploy').get().asFile.toURI()
                    }
                }
            }

            extensions.configure(SigningExtension) { SigningExtension signingExt ->
                signingExt.required {
                    publishEnabled && !subproject.version.toString().endsWith('-SNAPSHOT')
                }
                PublishingExtension publishing = extensions.getByType(PublishingExtension)
                signingExt.sign(publishing.publications)
            }

            tasks.withType(Sign).configureEach { Sign signTask ->
                signTask.onlyIf {
                    publishEnabled && !subproject.version.toString().endsWith('-SNAPSHOT')
                }
            }

            tasks.matching { it.name == 'jreleaserDeploy' }.configureEach {
                dependsOn tasks.named('publishAllPublicationsToJreleaserRepository')
            }
        }

        extensions.configure(JReleaserExtension) { JReleaserExtension jreleaser ->
            jreleaser.gitRootSearch = false

            jreleaser.announce { active = Active.NEVER }
            jreleaser.assemble { active = Active.NEVER }
            jreleaser.catalog { active = Active.NEVER }
            jreleaser.signing { active = Active.NEVER }

            jreleaser.deploy {
                maven {
                    mavenCentral {
                        app {
                            active.set(Active.RELEASE)
                            url.set('https://central.sonatype.com/api/v1/publisher')
                            snapshotSupported.set(false)

                            username = sonatypeUsername
                            password = sonatypePassword
                            setAuthorization(org.jreleaser.model.Http.Authorization.BASIC.name())

                            sign.set(false)
                            checksums.set(false)
                            sourceJar.set(true)
                            javadocJar.set(true)

                            applyMavenCentralRules.set(true)
                            verifyPom.set(false)

                            stagingRepository(subproject.layout.buildDirectory.dir('staging-deploy').get().asFile.absolutePath)

                            connectTimeout.set(20)
                            readTimeout.set(60)
                            verifyUrl.set('https://repo1.maven.org/maven2/{{path}}/{{filename}}')
                            namespace.set('io.geewit')
                            deploymentId.set("${localGroup ?: subproject.group}:${localArtifactId ?: subproject.name}:${rootProject.version as String}")
                            retryDelay.set(20)
                            maxRetries.set(100)
                        }
                    }
                }
            }

            jreleaser.upload { active = Active.NEVER }
        }
    }
}
